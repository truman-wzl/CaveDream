group = 'com.cavedream'
version = '1.0-SNAPSHOT'

subprojects {
    apply plugin: 'java'

    group = 'com.cavedream'
    version = rootProject.version

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
