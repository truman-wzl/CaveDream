spring:
  application:
    name: cavedream-server
  config:
    # 本地凭据在 application-local.yml（已 .gitignore，永不提交）；也可用环境变量 DB_USER/DB_PASSWORD 覆盖
    import: optional:classpath:application-local.yml
  datasource:
    # 本机 MySQL8 跑在 3307 端口（DBeaver 同端口）；库 cavedream（utf8mb4 / utf8mb4_0900_ai_ci）
    url: jdbc:mysql://localhost:3307/cavedream?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:cavedream}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    # QQ 邮箱 SMTP；账号与授权码在 application-local.yml（授权码勿入 git）
    host: smtp.qq.com
    port: 465
    properties:
      mail.smtp.ssl.enable: true
      mail.smtp.auth: true
      mail.smtp.connectiontimeout: 8000
      mail.smtp.timeout: 10000
  sql:
    init:
      mode: always          # 启动时自动执行 schema.sql（幂等 IF NOT EXISTS）
      continue-on-error: true   # 容忍重复列的 ALTER 迁移语句（仅对 schema 脚本生效）
      schema-locations: classpath:schema.sql

server:
  # 8080 已被你的 forum-backend 占用，CaveDream 后端用 8081
  port: ${SERVER_PORT:8081}

app:
  auth:
    # 开发主码：授权码配好前用验证码 888888 走通全流程；上线前必须改 false
    dev-master-code: true
