# CaveDream 统一版本目录（升版本只改这里）
[versions]
libgdx = "1.13.1"
springBoot = "3.5.4"
mysql = "9.1.0"
jackson = "2.17.2"
junit = "5.10.0"
assertj = "3.26.3"

[libraries]
# 游戏框架（core 模块）
gdx = { module = "com.badlogicgames.gdx:gdx", version.ref = "libgdx" }
# 桌面启动后端（desktop 模块）
gdx-backend-lwjgl3 = { module = "com.badlogicgames.gdx:gdx-backend-lwjgl3", version.ref = "libgdx" }
gdx-platform = { module = "com.badlogicgames.gdx:gdx-platform", version.ref = "libgdx" }
# 存档序列化
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
# 后端（server 模块）
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc", version.ref = "springBoot" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
# 测试
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
